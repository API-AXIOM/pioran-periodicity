[flake8]
max-line-length = 88
extend-ignore = E203, W503
exclude = .git,__pycache__,build,dist,*.egg-info
per-file-ignores =
    # matplotlib.use("Agg") must precede the pyplot import
    paper/plot_fits.py:E402
    paper/plot_corners.py:E402
    scripts/plot_bf_results.py:E402
    tests/test_visualization.py:E402
